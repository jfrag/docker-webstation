---

# project information
project_name: webstation
project_url: "https://github.com/romm-streaming/romm-broker"
project_logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webstation-logo.png"
project_blurb: "[Webstation romm-broker]({{ project_url }}) is a sidecar container to enable collaborative streaming sessions from the [ROMM](https://romm.app/) web interface."
project_lsio_github_repo_url: "https://github.com/linuxserver/docker-{{ project_name }}"
project_blurb_optional_extras_enabled: false
project_categories: "Games"
# supported architectures
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "latest"}
# development version
development_versions: false
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/config", desc: "Users home directory in the container, stores all files and games."}
param_usage_include_ports: true
param_ports:
  - {external_port: "3000", internal_port: "3000", port_desc: "Webstation romm-broker desktop gui HTTP must be proxied."}
  - {external_port: "3001", internal_port: "3001", port_desc: "Webstation romm-broker desktop gui HTTPS."}
custom_params:
  - {name: "shm-size", name_compose: "shm_size", value: "1gb", desc: "Recommended for all desktop images."}
# Selkies blurb settings
selkies_blurb: true
show_nvidia: true
# application setup block
app_setup_block_enabled: true
app_setup_block: |
  The application can be accessed at:

  * https://yourhost:3001/

  **This image only runs in Wayland mode and should be run with a GPU**

  **For complete setup see [https://github.com/romm-streaming/romm-broke](https://github.com/romm-streaming/romm-broker)
# init diagram
init_diagram: |
  "webstation:romm": {
    docker-mods
    base {
      fix-attr +\nlegacy cont-init
    }
    docker-mods -> base
    legacy-services
    custom services
    init-services -> legacy-services
    init-services -> custom services
    custom services -> legacy-services
    init-selkies-config -> init-romm-config
    init-romm-config -> init-selkies-end
    init-services -> svc-broker
    svc-selkies -> svc-broker
    svc-broker -> legacy-services
  }
  Base Images: {
    "selkies-base:ubunturesolute-version-5501a314"
  }
  "webstation:romm" <- Base Images
# changelog
changelogs:
  - {date: "21.08.26:", desc: "Add Xenia Edge emulator."}
  - {date: "13.08.26:", desc: "Add Azahar emulator."}
  - {date: "11.08.26:", desc: "Add Cemu emulator."}
  - {date: "08.08.26:", desc: "Initial release."}
